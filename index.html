<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emperor Event Center — Weddings at Valley Golf, Cainta</title>
<meta name="description" content="Emperor Event Center — an exclusive garden and glass hall wedding venue in Valley Golf, Cainta, Rizal. One celebration a day, entirely yours.">
<meta property="og:title" content="Emperor Event Center — Weddings">
<meta property="og:description" content="Where every love story becomes unforgettable. Garden ceremonies and elegant hall receptions in Cainta, Rizal.">
<meta property="og:image" content="images/couple_gazebo.jpg">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#1a1a1a;color:#fff;overflow:hidden}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);transition:transform 8s ease}
.slide.active .bg{transform:scale(1.12)}
.scrim{position:absolute;inset:0}
.scrim.hero{background:linear-gradient(90deg,rgba(20,15,30,.82) 0%,rgba(20,15,30,.55) 45%,rgba(20,15,30,.15) 100%)}
.scrim.cta{background:linear-gradient(0deg,rgba(15,10,25,.9) 0%,rgba(30,20,45,.7) 100%)}
.content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:8vh 7vw;max-width:60%}
.content.center{max-width:100%;align-items:center;text-align:center;padding:8vh 8vw}
.kicker{font-size:clamp(11px,1.1vw,15px);letter-spacing:3px;text-transform:uppercase;font-weight:400;color:#e9c9a0;margin-bottom:18px}
.title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(38px,6vw,86px);line-height:1.02;margin-bottom:14px;letter-spacing:.5px}
.subtitle{font-family:'Cormorant Garamond',serif;font-weight:400;font-style:italic;font-size:clamp(18px,2.4vw,34px);color:#f0e6da;margin-bottom:34px}
.points{list-style:none;display:flex;flex-direction:column;gap:15px;max-width:560px}
.points li{position:relative;padding-left:30px;font-size:clamp(13px,1.4vw,18px);font-weight:300;line-height:1.5;color:#f5eee6}
.points li::before{content:'';position:absolute;left:0;top:.55em;width:14px;height:1px;background:#e9c9a0}
.center .points{align-items:center;text-align:center}
.center .points li{padding-left:0}
.center .points li::before{display:none}
.split{display:flex;width:100%;height:100%}
.split .imgcol{flex:1;position:relative;overflow:hidden}
.split .imgcol .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 8s ease}
.slide.active .split .imgcol .ph{transform:scale(1.1)}
.split .textcol{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;padding:8vh 5vw;background:linear-gradient(135deg,#241a30,#3a2547)}
.cta-contact{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:center}
.cta-contact .row{font-size:clamp(15px,1.8vw,22px);font-weight:400;letter-spacing:1px;display:flex;align-items:center;gap:12px}
.cta-line{width:70px;height:1px;background:#e9c9a0;margin:8px auto 0}
.brand{position:absolute;top:26px;left:0;right:0;text-align:center;z-index:5;font-family:'Cormorant Garamond',serif;font-size:clamp(16px,1.6vw,22px);letter-spacing:4px;text-transform:uppercase;color:#fff;pointer-events:none;opacity:.9}
.crown{color:#e9c9a0}
.nav{position:absolute;bottom:28px;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:22px}
.arrow{width:46px;height:46px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.25s;backdrop-filter:blur(4px)}
.arrow:hover{background:#e9c9a0;border-color:#e9c9a0;color:#2a1c38}
.dots{display:flex;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s}
.dot.active{background:#e9c9a0;width:26px;border-radius:5px}
.count{position:absolute;bottom:34px;right:34px;z-index:10;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.6)}
@media(max-width:760px){
 .content{max-width:100%;padding:12vh 8vw}
 .scrim.hero{background:linear-gradient(0deg,rgba(20,15,30,.92),rgba(20,15,30,.5))}
 .split{flex-direction:column}
 .split .textcol{padding:6vh 8vw}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand">E M P E R O R <span class="crown">&#9733;</span> E V E N T &nbsp; C E N T E R</div>
  <div id="slides"></div>
  <div class="count" id="count"></div>
  <div class="nav">
    <button class="arrow" onclick="go(-1)" aria-label="Previous">&#8249;</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" onclick="go(1)" aria-label="Next">&#8250;</button>
  </div>
</div>
<script>
const S = [{"img": "images/couple_gazebo.jpg", "kicker": "Emperor Event Center \u00b7 Valley Golf, Cainta", "title": "Your Dream Wedding Awaits", "subtitle": "Where every love story becomes unforgettable", "points": ["An exclusive venue \u2014 only one wedding a day, entirely yours", "Enchanted garden and elegant hall under one roof", "Complete wedding solutions from ceremony to reception"], "layout": "hero"}, {"img": "images/sparkler_kiss.jpg", "kicker": "Why couples choose us", "title": "Luxury, Intimacy, and You", "subtitle": "Every detail designed around your celebration", "points": ["Breathtaking garden and indoor spaces to choose from", "Personalized attention from a dedicated coordination team", "A private setting, far from distractions", "Photography-ready backdrops at every turn"], "layout": "hero"}, {"img": "images/aisle_arch.jpg", "img2": "images/garden_sky.jpg", "kicker": "The Garden Ceremony", "title": "Say I Do in Paradise", "subtitle": "Lush greenery, white florals, and golden light", "points": ["Romantic garden aisle framed by fresh blooms", "Signature floral arch and dome gazebo", "String lights that turn dusk into magic"], "layout": "split"}, {"img": "images/gazebo_blue.jpg", "img2": "images/aisle_signs.jpg", "kicker": "Garden details", "title": "Moments Worth Framing", "subtitle": "Intimate corners styled for your story", "points": ["Dome gazebo for vows and portraits", "Elegant signage and petal-lined walkways", "Natural beauty in every direction"], "layout": "split"}, {"img": "images/glass_hall_promo.jpg", "img2": "images/hall_table.jpg", "kicker": "The Glass Hall Reception", "title": "An Evening of Elegance", "subtitle": "Fairy lights, hanging florals, and a grand welcome", "points": ["Sophisticated hall with ambient lighting", "Spacious dance floor and guest seating", "Transforms beautifully for dinner and dancing"], "layout": "split"}, {"img": "images/entrance_arch.jpg", "img2": "images/hall_orange.jpg", "kicker": "Styling and ambiance", "title": "Every Detail, Curated", "subtitle": "From grand entrances to intimate table settings", "points": ["Stunning floral entrances and installations", "Ambient lighting throughout every venue", "Flexible styling to match your palette"], "layout": "split"}, {"img": "images/group_kiss.jpg", "kicker": "Celebrate your love story", "title": "Complete Wedding Packages", "subtitle": "We handle everything, so you can be present", "points": ["Full event coordination from start to finish", "Catering, hospitality, and guest accommodations", "Flexible packages tailored to your vision"], "layout": "hero"}, {"img": "images/couple_gazebo.jpg", "kicker": "Make your dream reality", "title": "Book Your Unforgettable Day", "subtitle": "Limited dates \u2014 one celebration per day", "points": [], "layout": "cta"}];
let cur = 0;
const wrap = document.getElementById('slides');
const dots = document.getElementById('dots');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i===0?' active':'');
  if (s.layout === 'split') {
    el.innerHTML = `
      <div class="split">
        <div class="imgcol"><div class="ph" style="background-image:url('${s.img}')"></div></div>
        <div class="textcol">
          <div class="kicker">${s.kicker}</div>
          <div class="title">${s.title}</div>
          <div class="subtitle">${s.subtitle}</div>
          <ul class="points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>
        </div>
        <div class="imgcol"><div class="ph" style="background-image:url('${s.img2||s.img}')"></div></div>
      </div>`;
  } else {
    const centered = s.layout === 'cta';
    el.innerHTML = `
      <div class="bg" style="background-image:url('${s.img}')"></div>
      <div class="scrim ${centered?'cta':'hero'}"></div>
      <div class="content ${centered?'center':''}">
        <div class="kicker">${s.kicker}</div>
        <div class="title">${s.title}</div>
        <div class="subtitle">${s.subtitle}</div>
        ${s.points.length?`<ul class="points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}
        ${centered?`
          <div class="cta-line"></div>
          <div class="cta-contact">
            <div class="row">&#9742;&nbsp; 0917-309-2061</div>
            <div class="row">&#127760;&nbsp; emperoreventcenter.com</div>
            <div class="row">&#128205;&nbsp; Valley Golf, Cainta, Rizal</div>
          </div>`:''}
      </div>`;
  }
  wrap.appendChild(el);
  const d = document.createElement('button');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = () => show(i);
  dots.appendChild(d);
});
const slideEls = () => document.querySelectorAll('.slide');
const dotEls = () => document.querySelectorAll('.dot');
function show(i){
  cur = (i + S.length) % S.length;
  slideEls().forEach((e,idx)=>e.classList.toggle('active', idx===cur));
  dotEls().forEach((e,idx)=>e.classList.toggle('active', idx===cur));
  document.getElementById('count').textContent = String(cur+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
}
function go(d){ show(cur + d); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
show(0);
</script>
</body>
</html>
